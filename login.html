<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <title>Login - DIGIVEX STORE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body style="padding-bottom:0">
  <div id="toastContainer"><i class="fa-solid fa-circle-check" id="toastIcon"></i><span id="toastMessage">Pesan</span></div>
  <div style="display:flex;flex-direction:column;justify-content:center;min-height:100vh;padding:30px">
    <div class="login-logo"><i class="fa-solid fa-bolt"></i></div>
    <h1 class="login-title">Masuk ke DIGIVEX STORE</h1>
    <input type="text" id="loginName" class="login-input" placeholder="Masukkan Nama Anda" autocomplete="name">
    <input type="email" id="loginEmail" class="login-input" placeholder="Masukkan Email Anda" autocomplete="email">
    <button class="login-btn" id="loginButton" onclick="prosesLogin()">Masuk Aplikasi</button>
    <a href="admin.html" style="text-align:center;margin-top:18px;color:#4f46e5;text-decoration:none;font-weight:600">Login Admin</a>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = supabase.createClient(
      "https://bopjwidqospiraxzpqz.supabase.co",
      "sb_publishable_DXnkosMz9WhV5D4KDLvPbA_Nkpeg_ZX"
    );

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toastContainer');
      document.getElementById('toastMessage').innerText = message;
      toast.className = 'show ' + type;
      document.getElementById('toastIcon').className = type === 'success'
        ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-xmark';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 4500);
    }

    async function prosesLogin() {
      const nama = document.getElementById('loginName').value.trim();
      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const button = document.getElementById('loginButton');
      if (!nama || !email) return showToast('Nama dan Email wajib diisi!', 'error');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showToast('Format email tidak valid.', 'error');

      button.disabled = true;
      button.textContent = 'Memproses...';
      try {
        // Simpan profil pelanggan. Jika email sudah ada (unique violation),
        // pelanggan tetap boleh masuk memakai profil yang sudah terdaftar.
        const { error } = await sb.from('users').insert([{ nama, email }]);
        if (error && error.code !== '23505') {
          console.error('DIGIVEX login error:', error);
          showToast('Gagal menyimpan: ' + (error.message || 'Kesalahan database'), 'error');
          return;
        }

        localStorage.setItem('topup_user', nama);
        localStorage.setItem('topup_email', email);
        localStorage.removeItem('topup_admin');
        showToast('Login berhasil! Mengalihkan...', 'success');
        setTimeout(() => { window.location.href = 'index.html'; }, 900);
      } catch (err) {
        console.error(err);
        showToast('Koneksi gagal: ' + (err.message || 'Periksa internet Anda'), 'error');
      } finally {
        button.disabled = false;
        button.textContent = 'Masuk Aplikasi';
      }
    }
  </script>
</body>
</html>
