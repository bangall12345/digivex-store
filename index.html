<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <title>DIGIVEX STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <!-- Favicon & PWA -->
    <link rel="icon" type="image/png" href="https://i.ibb.co.com/6PyY6Z0/logo.png">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div id="toastContainer"><i class="fa-solid fa-circle-check" id="toastIcon"></i><span id="toastMessage">Pesan</span></div>

    <!-- HEADER -->
    <header class="app-header">
        <div class="logo"><span class="brand-mark"><i class="fa-solid fa-bolt"></i></span><span>DIGIVEX <b>STORE</b><small>TOP UP • GAME • DIGITAL</small></span></div>
    </header>

    <main class="container">
        <!-- BERANDA -->
        <div id="page-home" class="page active">
            <div class="banner hero-banner">
                <div class="hero-copy">
                    <span class="badge"><i class="fa-solid fa-crown"></i> TOP UP INSTANT</span>
                    <h2>Mobile Legends</h2>
                    <p><i class="fa-solid fa-bolt"></i> Proses otomatis 24 jam</p>
                    <span class="hero-cta">Top Up Sekarang <i class="fa-solid fa-chevron-right"></i></span>
                </div>
                <span class="hero-glow" aria-hidden="true"></span>
            </div>
            
            <div class="category-grid">
                <div class="category-item active-cat" id="cat-Pulsa" onclick="filterKategori('Pulsa', this)"><i class="fa-solid fa-mobile-screen cat-icon text-blue"></i><span>Pulsa</span></div>
                <div class="category-item" id="cat-Data" onclick="filterKategori('Data', this)"><i class="fa-solid fa-wifi cat-icon text-green"></i><span>Data</span></div>
                <div class="category-item" id="cat-Game" onclick="filterKategori('Game', this)"><i class="fa-solid fa-gamepad cat-icon text-purple"></i><span>Game</span></div>
                <div class="category-item" onclick="showToast('Fitur Listrik segera hadir!', 'info')"><i class="fa-solid fa-bolt cat-icon text-orange"></i><span>Listrik</span></div>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Cari produk impianmu..." onkeyup="cariProduk()">
            </div>
            
            <h3 class="section-title" id="sectionTitle">Katalog Pulsa</h3>
            <div class="product-grid" id="productList"></div>
        </div>

        <!-- LACAK PESANAN -->
        <div id="page-tracking" class="page">
            <h3 class="section-title">Lacak Pesanan</h3>
            <div class="tracking-box">
                <p style="font-size:13px; color:var(--text-muted); margin-bottom:15px;">Masukkan Nomor Invoice atau ID Tujuan Anda.</p>
                <input type="text" id="trackingInput" class="form-input" placeholder="Contoh: INV-12345 atau 12345678">
                <button class="btn-submit" onclick="lacakPesanan()">Cari Pesanan</button>
            </div>
            <div id="trackingResult" style="margin-top:20px;"></div>
        </div>

        <!-- RIWAYAT -->
        <div id="page-history" class="page">
            <h3 class="section-title">Riwayat Transaksi</h3>
            <div id="historyList"></div>
        </div>

        <!-- AKUN -->
        <div id="page-account" class="page">
            <h3 class="section-title">Profil Saya</h3>
            <div class="profile-box">
                <i class="fa-solid fa-circle-user"></i>
                <h3 id="profileNameDisplay">Pengguna</h3>
                <button class="btn-logout" onclick="prosesLogout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Keluar Akun</button>
            </div>
        </div>

        <!-- PANEL ADMIN SUDAH DIHAPUS DARI SINI -->
    </main>

    <nav class="bottom-nav">
        <a onclick="gantiHalaman('home', this)" class="active"><i class="fa-solid fa-house"></i><span>Beranda</span></a>
        <a onclick="gantiHalaman('tracking', this)"><i class="fa-solid fa-truck-fast"></i><span>Lacak</span></a>
        <a onclick="gantiHalaman('history', this)"><i class="fa-solid fa-clock-rotate-left"></i><span>Riwayat</span></a>
        <a onclick="gantiHalaman('account', this)"><i class="fa-solid fa-user"></i><span>Akun</span></a>
        <a href="admin.html"><i class="fa-solid fa-user-shield"></i><span>Admin</span></a>
    </nav>

    <div onclick="bukaFormWa()" class="cs-floating" style="cursor: pointer;">
        <i class="fa-brands fa-whatsapp"></i>
    </div>

    <!-- SEMUA MODAL (NOMINAL, CHECKOUT, INVOICE, WA) ADA DI components.html -->
    <div id="modal-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
    
    <script>
        // Memuat modal dari components.html
        fetch('components.html').then(r => r.text()).then(d => document.getElementById('modal-container').innerHTML = d);
        
        // Service worker PWA (opsional jika sudah ada)
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('service-worker.js'); }); }
    </script>
</body>
</html>
