<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <title>Login Admin - DIGIVEX STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body style="padding-bottom: 0;">

    <div id="toastContainer"><i class="fa-solid fa-circle-check" id="toastIcon"></i><span id="toastMessage">Pesan</span></div>

    <div style="display: flex; flex-direction: column; justify-content: center; min-height: 100vh; padding: 30px;">
        <div class="login-logo"><i class="fa-solid fa-user-shield"></i></div>
        <h1 class="login-title">Login Admin</h1>
        
        <input type="email" id="adminEmail" class="login-input" placeholder="Masukkan Email Admin">
        <input type="password" id="adminPassword" class="login-input" placeholder="Masukkan Password">
        
        <button class="login-btn" onclick="loginAdmin()">Masuk Panel Admin</button>
        <a href="index.html" style="text-align: center; margin-top: 15px; color: var(--text-muted); text-decoration: none; font-size: 14px;">Kembali ke Toko</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const sb = supabase.createClient("https://bopjwidqospiraxzpqz.supabase.co", "sb_publishable_DXnkosMz9WhV5D4KDLvPbA_Nkpeg_ZX");

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toastContainer');
            const icon = document.getElementById('toastIcon');
            document.getElementById('toastMessage').innerText = message;
            toast.className = 'show ' + type;
            icon.className = type === 'success' ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-xmark';
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        async function loginAdmin() {
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value.trim();
            
            if (!email || !password) return showToast("Email dan Password wajib diisi!", "error");
            
            showToast("Memeriksa...", "info");

            // Cek ke tabel users, apakah email dan password cocok dan rolenya 'admin'
            const { data, error } = await sb.from('users')
                .select('*')
                .eq('email', email)
                .eq('password', password)
                .eq('role', 'admin')
                .single();
            
            if (error || !data) {
                return showToast("Email atau Password salah, atau Anda bukan Admin.", "error");
            }

            // Jika berhasil, simpan status admin di HP
            localStorage.setItem('topup_admin', 'true');
            localStorage.setItem('topup_user', data.nama);
            localStorage.setItem('topup_email', data.email);
            
            showToast("Login Admin berhasil!", "success");
            setTimeout(() => {
                window.location.href = "index.html";
            }, 1500);
        }
    </script>
</body>
</html>
