<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <title>Login Admin - DIGIVEX STORE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body style="padding-bottom:0">
  <div id="toastContainer"><i class="fa-solid fa-circle-check" id="toastIcon"></i><span id="toastMessage">Pesan</span></div>
  <div style="display:flex;flex-direction:column;justify-content:center;min-height:100vh;padding:30px;max-width:560px;margin:auto">
    <div class="login-logo"><i class="fa-solid fa-user-shield"></i></div>
    <h1 class="login-title">Login Admin DIGIVEX</h1>
    <p style="text-align:center;color:#64748b;margin:-10px 0 22px">Gunakan akun admin yang dibuat melalui Supabase Authentication.</p>
    <form id="adminLoginForm">
      <input type="email" id="adminEmail" class="login-input" placeholder="Email Admin" autocomplete="username" required>
      <input type="password" id="adminPassword" class="login-input" placeholder="Password Admin" autocomplete="current-password" required>
      <button class="login-btn" id="adminLoginButton" type="submit">Masuk Panel Admin</button>
    </form>
    <a href="login.html" style="text-align:center;margin-top:18px;color:#4f46e5;text-decoration:none;font-weight:600">Kembali ke Login Pelanggan</a>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = supabase.createClient(
      "https://bopjwidqospiraxzpqz.supabase.co",
      "sb_publishable_DXnkosMz9WhV5D4KDLvPbA_Nkpeg_ZX"
    );
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toastContainer');
      document.getElementById('toastMessage').innerText = message;
      toast.className = 'show ' + type;
      document.getElementById('toastIcon').className = type === 'success'
        ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-xmark';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 5000);
    }

    document.getElementById('adminLoginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('adminEmail').value.trim().toLowerCase();
      const password = document.getElementById('adminPassword').value;
      const button = document.getElementById('adminLoginButton');
      button.disabled = true;
      button.textContent = 'Memeriksa akun...';
      try {
        const { data: authData, error: authError } = await sb.auth.signInWithPassword({ email, password });
        if (authError) throw new Error('Login ditolak: ' + authError.message);

        const userId = authData.user.id;
        const { data: roleData, error: roleError } = await sb
          .from('user_roles')
          .select('role')
          .eq('user_id', userId)
          .maybeSingle();

        if (roleError) throw new Error('Gagal memeriksa hak admin: ' + roleError.message);
        if (!roleData || roleData.role !== 'admin') {
          await sb.auth.signOut();
          throw new Error('Akun ini belum diberi hak Admin. Tambahkan role admin di tabel user_roles.');
        }

        localStorage.setItem('topup_admin', 'true');
        localStorage.setItem('topup_user', authData.user.user_metadata?.nama || email.split('@')[0]);
        localStorage.setItem('topup_email', email);
        showToast('Login admin berhasil. Membuka dashboard...', 'success');
        setTimeout(() => { window.location.href = 'index.html'; }, 700);
      } catch (error) {
        console.error('DIGIVEX admin login:', error);
        showToast(error.message || 'Login admin gagal.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = 'Masuk Panel Admin';
      }
    });
  </script>
</body>
</html>
